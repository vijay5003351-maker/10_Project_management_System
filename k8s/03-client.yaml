apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: devops-pms
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client-container
          image: client-pms:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service # ✅ corrected (was Services)
metadata:
  name: client
  namespace: devops-pms # ✅ corrected spelling
spec:
  selector:
    app: client # ✅ corrected (was labels)
  ports:
    - protocol: TCP # ✅ corrected spelling
      port: 3000
      targetPort: 3000
  type: ClusterIP # ✅ corrected spelling
